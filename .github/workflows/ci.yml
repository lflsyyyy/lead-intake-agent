name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Code node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --test
        run: node --test "tests/node/*.test.mjs"

  python-tests:
    name: Python tests (build, export sanitizing, drift, samples, mock, eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          python -m pip install --quiet pytest==8.3.4
          python -m pytest tests/python -q

  workflows:
    name: Workflow JSON validation and drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON is valid
        run: for f in workflows/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Exports match workflows/code and what build.py generates
        run: python -m unittest discover -s tests/python -t tests/python -p "test_workflow_json.py" -v
      - name: Docker Compose file is valid
        run: docker compose config -q

  docker-e2e:
    name: Docker stack end to end (no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # exactly the README quick start
      - name: docker compose up -d
        run: docker compose up -d
      - name: python tools/build.py --target docker
        run: python tools/build.py --target docker
      - name: python tools/send_samples.py --target docker
        run: python tools/send_samples.py --target docker
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=400
          curl -s http://localhost:8090/_state | head -c 20000 || true
      - name: docker compose down -v
        if: always()
        run: docker compose down -v

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the gitleaks CLI over the whole history (the action scans "<first commit>^..HEAD", which breaks on a new repo)
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
